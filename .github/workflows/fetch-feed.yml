name: Fetch PF Concept product feed

on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday, 06:00 UTC
  workflow_dispatch:        # lets you trigger it manually too

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download feed
        run: curl -sSL "http://www.pfconcept.com/portal/datafeed/productfeed_cnl1_en_v3.json" -o productfeed.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add productfeed.json
          git diff --staged --quiet || git commit -m "Update product feed"
          git push