name: Fetch PF Concept product feed

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download feed
        run: curl -sSL "http://www.pfconcept.com/portal/datafeed/productfeed_cnl1_en_v3.json" -o productfeed.json
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view latest-feed || gh release create latest-feed --title "Latest product feed" --notes "Auto-updated weekly"
      - name: Upload feed asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload latest-feed productfeed.json --clobber